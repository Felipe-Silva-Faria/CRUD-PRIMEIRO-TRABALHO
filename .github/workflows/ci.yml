name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  qualidade-e-testes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check dominio estruturas algoritmos utilitarios servicos analise persistencia/repositorio.py api/app_rest.py api/cliente_api.py interface/tema.py interface/componentes.py interface/acessibilidade.py tests

      - name: Testes unitarios e de integracao + cobertura
        run: >
          pytest -q
          --cov=dominio --cov=estruturas --cov=algoritmos --cov=utilitarios
          --cov=servicos --cov=persistencia.repositorio --cov=api
          --cov-report=term-missing --cov-fail-under=85

      - name: Benchmark
        run: python -m analise.benchmark
